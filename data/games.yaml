# The games HTG plays, in the order the grid shows them. Each card's art is the game's Steam
# library hero (no logo: PUBG forbids its logo without written consent), fetched at build time.
#
#   name:        as the game's publisher writes it
#   steam_appid: the Steam app ID; omit for a game that isn't on Steam
#   image:       optional art in assets/games/, used instead of Steam's (or when there is none)
#   blurb:       one or two sentences on how HTG plays it (quote it if it contains " #")
#   anchor:      optional crop anchor when the art is cut to 2:1: smart (default), left, right, top, …
#   channel:     the members' playbook channel on Discord
- name: Sea of Thieves
  steam_appid: 1172620
  blurb: Crews of friends via Xbox friends and Closed Crew invites, HTG guilds, and Custom Seas for big events.
  channel: sot-playbook
- name: Star Citizen
  blurb: Organised ops. Sign up for a seat, party at the main menu, launch together.
  channel: sc-playbook
- name: WARDOGS
  steam_appid: 1867240
  blurb: "The HTG community server, HTG WARDOGS | NA WEST | #1. Matches start at 20 players, so seeding matters."
  channel: wd-playbook
- name: Counter-Strike 2
  steam_appid: 730
  anchor: right
  blurb: Ten-player PUGs organised in Discord. HTG's own community servers are on the way.
  channel: cs-playbook
- name: "PUBG: BATTLEGROUNDS"
  steam_appid: 578080
  blurb: Duo and squad play, and custom matches for events.
  channel: pubg-playbook
