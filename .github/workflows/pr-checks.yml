# PR hygiene in one job: the title, the CHANGELOG and the component labels (the org's pr.yml,
# hidden-token-gaming/.github#47).
name: pr-checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    uses: hidden-token-gaming/.github/.github/workflows/pr.yml@main
