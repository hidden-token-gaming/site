# Build the site with a pinned Hugo, fail on broken internal links or anchors, then deploy to
# Cloudflare Pages: main to production, same-repo PRs to a preview (URL in the job summary).
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.162.1
  HUGO_SHA256: 4bfcdb092d0306586f1b72e5687787ead053faab2d71f09951d3c5fecde66873

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Hugo ${{ env.HUGO_VERSION }} (checksum pinned)
        run: |
          curl -sSLo hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum -c -
          tar -xzf hugo.tar.gz hugo && sudo install hugo /usr/local/bin/hugo && rm hugo hugo.tar.gz
      - name: Build
        run: hugo --gc --minify --panicOnWarning
      - name: Link check (internal links and anchors)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --index-files index.html
            --root-dir ${{ github.workspace }}/public --no-progress 'public/**/*.html'
          fail: true
          jobSummary: true
      - uses: actions/upload-artifact@v7
        with:
          name: public
          path: public
          retention-days: 7

  deploy:
    needs: build
    # Secrets aren't available to fork or Dependabot PRs, so those stop at build + link check.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: public
          path: public
      - id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=hiddentoken --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.pages.outputs.deployment-url }}
          ALIAS: ${{ steps.pages.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "### Deployed"
            echo "- Deployment: ${URL}"
            if [ -n "${ALIAS}" ]; then echo "- Branch alias: ${ALIAS}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
