baseURL = "https://hiddentoken.com/"
locale = "en-US"
title = "Hidden Token Gaming"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "Your hidden token to always having a game to play. Variety gaming for adults who play fair. 18+."
  sourceRepo = "https://github.com/hidden-token-gaming/site"
  # Muster's public calendar (site#20): the events page reads it at build time, with no token.
  # Connect's GET form of CalendarService/ListUpcoming, an empty request (the next 14 days).
  musterCalendar = "https://hub.hiddentoken.com/muster.v1.CalendarService/ListUpcoming?encoding=json&message=%7B%7D"

[markup.goldmark.parser]
  autoHeadingIDType = "github"   # the rules and legal pages read on GitHub too; keep its anchor ids
[markup.goldmark.renderer]
  unsafe = false
[markup.goldmark.extensions.typographer]
  disable = true                 # notices are copied verbatim; no smart quotes

[[menus.main]]
  name = "Games"
  pageRef = "/games"
  weight = 10
[[menus.main]]
  name = "Events"
  pageRef = "/events"
  weight = 15
[[menus.main]]
  name = "Rules"
  pageRef = "/policy"
  weight = 20
[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 30
# Join is the header's way into the Discord: the join page carries the age limit and the rules.
# Game cards also link it, each with its own invite (data/games.yaml).
[[menus.main]]
  name = "Join"
  pageRef = "/join"
  weight = 90
  [menus.main.params]
    cta = true

# Mounts are spelled out because the brand kit and the notices are also assets: brand colours and
# mark files come from brand/, so a brand change is one PR here, and the footer is read from the
# notices page so the publisher notices have one source.
[module]
  [module.hugoVersion]
    min = "0.162.0"
    extended = false
  [[module.mounts]]
    source = "content/legal/notices.md"
    target = "assets/legal/notices.md"
  [[module.mounts]]
    source = "brand/tokens.css"
    target = "assets/css/tokens.css"
  [[module.mounts]]
    source = "brand/logo"
    target = "assets/brand"
    files = ["htg-mark-noglow.svg", "htg-mark-mono.svg", "htg-mark-auto.svg", "png/htg-mark-noglow-32.png", "png/htg-mark-256.png"]
  [[module.mounts]]
    # The same mark files once more at stable paths (/brand/htg-mark-noglow.svg, ...): the hub on
    # hub.hiddentoken.com loads its logo and favicon from the site, and a fingerprinted name would
    # change under it. The pages keep using the fingerprinted copies from the assets mount above.
    source = "brand/logo"
    target = "static/brand"
    files = ["htg-mark-noglow.svg", "htg-mark-mono.svg", "htg-mark-auto.svg", "png/htg-mark-noglow-32.png", "png/htg-mark-256.png"]
  [[module.mounts]]
    # The War Dogs banner at a stable path for the hub's War Dogs overlay (gravel#66,
    # hidden-token-gaming/deploy#127), which shows it on the server's pages on hub.hiddentoken.com.
    source = "brand/wardogs"
    target = "static/brand/wardogs"
    files = ["server-banner-1024x256.png"]
  [[module.mounts]]
    source = "brand/social"
    target = "assets/brand/social"
    files = ["og-image-1200x630.png"]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"

# The events page converts times to US Central with the build's TZ (layouts/_partials/local-time.html),
# so the template may read TZ; the defaults are kept.
[security.funcs]
  getenv = ["^HUGO_", "^CI$", "^TZ$"]
