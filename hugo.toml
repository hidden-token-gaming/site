baseURL = "https://hiddentoken.com/"
locale = "en-US"
title = "Hidden Token Gaming"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "A variety gaming community: Sea of Thieves, Star Citizen, War Dogs, Counter-Strike 2 and PUBG: BATTLEGROUNDS."
  discord = "https://discord.gg/6AKnEQV"
  handbookRepo = "https://github.com/hidden-token-gaming/handbook"

[markup.goldmark.parser]
  autoHeadingIDType = "github"   # handbook anchors are written against GitHub's ids
[markup.goldmark.renderer]
  unsafe = false
[markup.goldmark.extensions.typographer]
  disable = true                 # notices are copied verbatim; no smart quotes

[[menus.main]]
  name = "Games"
  pageRef = "/games"
  weight = 10
[[menus.main]]
  name = "Join"
  pageRef = "/join"
  weight = 20
[[menus.main]]
  name = "Playbooks"
  pageRef = "/playbooks"
  weight = 30
[[menus.main]]
  name = "Rules"
  pageRef = "/policy"
  weight = 40

# The handbook is the source for rules, playbooks and legal pages. Its directories mount at the same
# paths, so the handbook's own relative links resolve here. Section READMEs are replaced by the
# site's own _index.md pages.
[module]
  [module.hugoVersion]
    min = "0.162.0"
    extended = false
  [[module.imports]]
    path = "github.com/hidden-token-gaming/handbook"
    [[module.imports.mounts]]
      source = "policy"
      target = "content/policy"
      files = ["! README.md"]
    [[module.imports.mounts]]
      source = "playbooks"
      target = "content/playbooks"
      files = ["! README.md"]
    [[module.imports.mounts]]
      source = "legal"
      target = "content/legal"
      files = ["! README.md"]
    [[module.imports.mounts]]
      source = "legal/notices.md"
      target = "assets/handbook/notices.md"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
